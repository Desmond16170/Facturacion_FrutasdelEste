<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutas y Jugos del Este</title>
<meta name="description" content="Pulpas congeladas y galones de jugo natural. Hacé tu pedido aquí.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --verde:       #1b4332;
  --verde-m:     #2d6a4f;
  --verde-c:     #52b788;
  --verde-s:     #d8f3dc;
  --naranja:     #e76f51;
  --crema:       #fefae0;
  --crema-d:     #f5f0d8;
  --texto:       #1a1a1a;
  --gris:        #6b7280;
  --blanco:      #ffffff;
  --radio:       18px;
  --sombra:      0 2px 20px rgba(0,0,0,0.08);
  --sombra-h:    0 8px 32px rgba(27,67,50,0.18);
}
body { font-family:'DM Sans',sans-serif; background:var(--crema); color:var(--texto); min-height:100vh; -webkit-font-smoothing:antialiased; }

header { background:var(--verde); color:white; position:relative; overflow:hidden; }
.header-inner { position:relative; z-index:2; padding:2.5rem 1.5rem 3.5rem; text-align:center; }
header::after { content:''; position:absolute; bottom:-1px; left:0; right:0; height:40px; background:var(--crema); clip-path:ellipse(55% 100% at 50% 100%); z-index:1; }
.header-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(255,255,255,0.12); border:1px solid rgba(255,255,255,0.2); border-radius:99px; padding:4px 14px; font-size:0.75rem; letter-spacing:0.05em; text-transform:uppercase; margin-bottom:1rem; }
header h1 { font-family:'Fraunces',serif; font-size:clamp(2rem,7vw,3.2rem); font-weight:900; line-height:1.1; letter-spacing:-1px; }
header p  { margin-top:0.6rem; font-size:0.95rem; opacity:0.75; font-weight:300; }

main { max-width:960px; margin:0 auto; padding:1.5rem 1rem 8rem; }

.seccion-titulo { font-family:'Fraunces',serif; font-size:1.4rem; font-weight:700; color:var(--verde); display:flex; align-items:baseline; gap:0.5rem; margin:2rem 0 1rem; padding-bottom:0.6rem; border-bottom:2px solid var(--verde-s); }
.seccion-titulo small { font-family:'DM Sans',sans-serif; font-size:0.72rem; font-weight:600; color:var(--verde-c); background:var(--verde-s); padding:2px 10px; border-radius:99px; margin-left:auto; white-space:nowrap; }

.productos-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(165px,1fr)); gap:1rem; }

.card { background:var(--blanco); border-radius:var(--radio); box-shadow:var(--sombra); overflow:hidden; display:flex; flex-direction:column; transition:transform 0.22s,box-shadow 0.22s; border:2px solid transparent; }
.card:hover { transform:translateY(-4px); box-shadow:var(--sombra-h); border-color:var(--verde-s); }
.card-img { width:100%; aspect-ratio:4/3; background:var(--crema-d); display:flex; align-items:center; justify-content:center; font-size:3.5rem; overflow:hidden; flex-shrink:0; }
.card-img img { width:100%; height:100%; object-fit:cover; display:block; }
.card-body { padding:0.9rem; display:flex; flex-direction:column; flex:1; gap:0.3rem; }
.card-nombre { font-weight:600; font-size:0.9rem; line-height:1.3; color:var(--verde); }
.card-desc   { font-size:0.75rem; color:var(--gris); line-height:1.4; flex:1; }
.card-unidad { font-size:0.68rem; background:var(--verde-s); color:var(--verde-m); padding:2px 8px; border-radius:99px; display:inline-block; font-weight:600; width:fit-content; }
.card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:0.5rem; gap:0.3rem; }
.card-precio { font-weight:700; font-size:1rem; color:var(--verde); white-space:nowrap; }

.qty-wrap { display:flex; align-items:center; gap:4px; }
.qty-btn { width:28px; height:28px; border-radius:50%; border:none; font-size:1rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.15s,transform 0.1s; }
.qty-btn:active { transform:scale(0.9); }
.qty-btn.plus  { background:var(--verde); color:white; }
.qty-btn.plus:hover  { background:var(--verde-m); }
.qty-btn.minus { background:#f0f0f0; color:var(--texto); }

#carrito-fab { position:fixed; bottom:1.25rem; left:50%; transform:translateX(-50%) translateY(120px); background:var(--naranja); color:white; border:none; border-radius:99px; padding:0.9rem 1.6rem; font-size:0.95rem; font-weight:600; cursor:pointer; box-shadow:0 6px 24px rgba(231,111,81,0.45); display:flex; align-items:center; gap:0.6rem; transition:transform 0.35s cubic-bezier(.34,1.56,.64,1); z-index:100; font-family:'DM Sans',sans-serif; white-space:nowrap; }
#carrito-fab.visible { transform:translateX(-50%) translateY(0); }
#carrito-badge { background:white; color:var(--naranja); border-radius:50%; width:22px; height:22px; font-size:0.72rem; display:flex; align-items:center; justify-content:center; font-weight:800; }

#overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:200; backdrop-filter:blur(2px); }
#overlay.visible { opacity:1; pointer-events:all; }

#panel-carrito { position:fixed; bottom:0; left:0; right:0; background:var(--blanco); border-radius:24px 24px 0 0; max-height:88vh; display:flex; flex-direction:column; transform:translateY(100%); transition:transform 0.35s cubic-bezier(.34,1.15,.64,1); z-index:300; box-shadow:0 -6px 40px rgba(0,0,0,0.15); }
#panel-carrito.abierto { transform:translateY(0); }
.panel-drag { width:40px; height:4px; background:#e5e7eb; border-radius:99px; margin:12px auto 0; flex-shrink:0; }
.panel-header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem 0.75rem; flex-shrink:0; }
.panel-header h2 { font-family:'Fraunces',serif; font-size:1.3rem; }
.btn-cerrar { background:#f3f4f6; border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:0.85rem; }
.carrito-scroll { overflow-y:auto; flex:1; padding:0 1.25rem; }
.carrito-item { display:flex; align-items:center; gap:0.75rem; padding:0.85rem 0; border-bottom:1px solid #f3f4f6; }
.ci-img { width:52px; height:52px; border-radius:10px; background:var(--crema-d); display:flex; align-items:center; justify-content:center; font-size:1.8rem; overflow:hidden; flex-shrink:0; }
.ci-img img { width:100%; height:100%; object-fit:cover; }
.ci-info { flex:1; min-width:0; }
.ci-nombre { font-weight:600; font-size:0.88rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ci-precio { font-size:0.75rem; color:var(--gris); }
.ci-controls { display:flex; align-items:center; gap:5px; background:#f8f8f8; border-radius:99px; padding:3px 7px; }
.ci-controls button { background:none; border:none; font-size:1.1rem; cursor:pointer; color:var(--verde); font-weight:700; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
.ci-controls button:hover { background:var(--verde-s); }
.ci-controls span { font-weight:700; font-size:0.85rem; min-width:18px; text-align:center; }
.ci-subtotal { font-weight:700; font-size:0.85rem; color:var(--verde); white-space:nowrap; }
.panel-footer { padding:1rem 1.25rem 1.5rem; flex-shrink:0; border-top:1px solid #f3f4f6; display:flex; flex-direction:column; gap:0.75rem; }
.total-row { display:flex; justify-content:space-between; align-items:center; }
.total-label { font-size:0.85rem; color:var(--gris); font-weight:500; }
#carrito-grand-total { font-size:1.3rem; font-weight:800; color:var(--verde); }
.form-cliente { display:flex; flex-direction:column; gap:0.5rem; }
.form-cliente input { border:2px solid #e5e7eb; border-radius:10px; padding:0.65rem 1rem; font-family:'DM Sans',sans-serif; font-size:0.9rem; outline:none; transition:border-color 0.2s; background:#fafafa; }
.form-cliente input:focus { border-color:var(--verde); background:white; }
.form-cliente input.error { border-color:#e74c3c; }
.btn-whatsapp { width:100%; background:#25D366; color:white; border:none; border-radius:14px; padding:1rem; font-size:1rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:0.5rem; font-family:'DM Sans',sans-serif; transition:background 0.2s; }
.btn-whatsapp:hover { background:#1ebe5d; }

#toast { position:fixed; top:1.25rem; left:50%; transform:translateX(-50%) translateY(-90px); background:var(--verde); color:white; padding:0.7rem 1.4rem; border-radius:99px; font-weight:600; font-size:0.875rem; transition:transform 0.4s cubic-bezier(.34,1.56,.64,1); z-index:999; white-space:nowrap; box-shadow:0 4px 16px rgba(27,67,50,0.35); }
#toast.visible { transform:translateX(-50%) translateY(0); }

.empty-state { text-align:center; padding:4rem 2rem; color:var(--gris); }
.empty-state span { font-size:3rem; display:block; margin-bottom:1rem; }

@media (max-width:480px) {
  .productos-grid { grid-template-columns:repeat(2,1fr); gap:0.75rem; }
  .card-body { padding:0.75rem; }
  .card-desc { display:none; }
}
@media (min-width:640px) {
  #panel-carrito { max-width:480px; left:50%; right:auto; transform:translateX(-50%) translateY(100%); }
  #panel-carrito.abierto { transform:translateX(-50%) translateY(0); }
}
</style>
</head>
<body>

<div id="toast">✅ ¡Pedido enviado a WhatsApp!</div>

<header>
  <div class="header-inner">
    <div class="header-badge">🌿 Natural · Congelado · Fresco</div>
    <h1>Frutas y Jugos del Este</h1>
    <p>Pedí desde acá · Te llega a la puerta</p>
  </div>
</header>

<div id="overlay" onclick="cerrarCarrito()"></div>

<main>
  <div id="productos-container">
    <div class="empty-state"><span>🍓</span><p>Cargando productos...</p></div>
  </div>
</main>

<button id="carrito-fab" onclick="abrirCarrito()">
  🛒 Ver pedido
  <span id="carrito-badge">0</span>
  <span id="fab-total"></span>
</button>

<div id="panel-carrito">
  <div class="panel-drag"></div>
  <div class="panel-header">
    <h2>Tu pedido 🛒</h2>
    <button class="btn-cerrar" onclick="cerrarCarrito()">✕</button>
  </div>
  <div class="carrito-scroll" id="carrito-lista"></div>
  <div class="panel-footer">
    <div class="total-row">
      <span class="total-label">Total del pedido</span>
      <span id="carrito-grand-total">₡0</span>
    </div>
    <div class="form-cliente">
      <input id="cliente-nombre"    placeholder="Tu nombre completo *" autocomplete="name">
      <input id="cliente-direccion" placeholder="Dirección de entrega (opcional)">
    </div>
    <button class="btn-whatsapp" onclick="enviarPedido()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Enviar pedido por WhatsApp
    </button>
  </div>
</div>

<script>
const WHATSAPP = '50662253122';
const NEGOCIO  = 'Frutas y Jugos del Este';

let productos = [], carrito = [];

// ── Cargar productos desde API ─────────────
async function cargarProductos() {
  try {
    const res  = await fetch('/api/productos');
    productos  = await res.json();
    renderCatalogo();
  } catch {
    document.getElementById('productos-container').innerHTML =
      '<div class="empty-state"><span>⚠️</span><p>Error cargando productos. Recargá la página.</p></div>';
  }
}

function renderCatalogo() {
  const cont    = document.getElementById('productos-container');
  const pulpas  = productos.filter(p => p.categoria === 'pulpa');
  const galones = productos.filter(p => p.categoria === 'galon');
  if (!productos.length) {
    cont.innerHTML = '<div class="empty-state"><span>🍃</span><p>Productos próximamente...</p></div>'; return;
  }
  let html = '';
  if (pulpas.length)  html += seccion('🧊 Pulpas Congeladas', pulpas,  pulpas.length  + ' variedades');
  if (galones.length) html += seccion('🥤 Galones de Jugo',   galones, galones.length + ' variedades');
  cont.innerHTML = html;
  cont.querySelectorAll('[data-add]').forEach(btn =>
    btn.addEventListener('click', () => add(btn.dataset.add))
  );
}

function seccion(titulo, items, badge) {
  return `<div class="seccion-titulo">${titulo}<small>${badge}</small></div>
          <div class="productos-grid">${items.map(cardHTML).join('')}</div>`;
}

function cardHTML(p) {
  const q   = (carrito.find(c => c.id === p.id) || {}).cantidad || 0;
  const img = p.imagen_url
    ? `<div class="card-img"><img src="${p.imagen_url}" alt="${p.nombre}" loading="lazy"></div>`
    : `<div class="card-img">${p.emoji || '🧃'}</div>`;
  return `
    <div class="card">
      ${img}
      <div class="card-body">
        <div class="card-nombre">${p.nombre}</div>
        <div class="card-desc">${p.descripcion || ''}</div>
        <div class="card-unidad">${p.unidad}</div>
        <div class="card-footer">
          <span class="card-precio">₡${Number(p.precio).toLocaleString('es-CR')}</span>
          <div class="qty-wrap">
            ${q > 0 ? `<button class="qty-btn minus" onclick="menos('${p.id}')">−</button>
                       <span style="font-weight:700;font-size:.9rem;min-width:18px;text-align:center">${q}</span>` : ''}
            <button class="qty-btn plus" data-add="${p.id}">+</button>
          </div>
        </div>
      </div>
    </div>`;
}

function add(id) {
  const p = productos.find(x => x.id === id); if (!p) return;
  const i = carrito.findIndex(c => c.id === id);
  if (i >= 0) carrito[i].cantidad++; else carrito.push({ ...p, cantidad: 1 });
  sync();
}
function menos(id) {
  const i = carrito.findIndex(c => c.id === id); if (i < 0) return;
  if (--carrito[i].cantidad <= 0) carrito.splice(i, 1);
  sync();
}

function sync() {
  renderCatalogo();
  const total = carrito.reduce((s,c) => s + c.precio * c.cantidad, 0);
  const qty   = carrito.reduce((s,c) => s + c.cantidad, 0);
  document.getElementById('carrito-badge').textContent = qty;
  document.getElementById('fab-total').textContent     = qty ? `· ₡${total.toLocaleString('es-CR')}` : '';
  document.getElementById('carrito-fab').classList.toggle('visible', qty > 0);
  renderPanel();
}

function renderPanel() {
  const total = carrito.reduce((s,c) => s + c.precio * c.cantidad, 0);
  document.getElementById('carrito-lista').innerHTML = carrito.map(item => {
    const img = item.imagen_url
      ? `<div class="ci-img"><img src="${item.imagen_url}" alt="${item.nombre}"></div>`
      : `<div class="ci-img">${item.emoji || '🧃'}</div>`;
    return `
      <div class="carrito-item">
        ${img}
        <div class="ci-info">
          <div class="ci-nombre">${item.nombre}</div>
          <div class="ci-precio">₡${Number(item.precio).toLocaleString('es-CR')} c/u</div>
        </div>
        <div class="ci-controls">
          <button onclick="menos('${item.id}')">−</button>
          <span>${item.cantidad}</span>
          <button onclick="add('${item.id}')">+</button>
        </div>
        <div class="ci-subtotal">₡${(item.precio*item.cantidad).toLocaleString('es-CR')}</div>
      </div>`;
  }).join('');
  document.getElementById('carrito-grand-total').textContent = `₡${total.toLocaleString('es-CR')}`;
}

function abrirCarrito()  { document.getElementById('panel-carrito').classList.add('abierto');    document.getElementById('overlay').classList.add('visible'); }
function cerrarCarrito() { document.getElementById('panel-carrito').classList.remove('abierto'); document.getElementById('overlay').classList.remove('visible'); }

async function enviarPedido() {
  const nombre    = document.getElementById('cliente-nombre').value.trim();
  const direccion = document.getElementById('cliente-direccion').value.trim();
  const input     = document.getElementById('cliente-nombre');
  if (!nombre) { input.classList.add('error'); input.focus(); return; }
  input.classList.remove('error');

  const total  = carrito.reduce((s,c) => s + c.precio * c.cantidad, 0);
  const lineas = carrito.map(i => `  • ${i.nombre} × ${i.cantidad} = ₡${(i.precio*i.cantidad).toLocaleString('es-CR')}`).join('\n');
  const msg    = ` *NUEVO PEDIDO — ${NEGOCIO}*\n\n *Cliente:* ${nombre}\n` +
    (direccion ? ` *Dirección:* ${direccion}\n` : '') +
    `\n*Productos:*\n${lineas}\n\n *TOTAL: ₡${total.toLocaleString('es-CR')}*\n\nPedido desde el catálogo online`;

  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');

  // Guardar pedido en Supabase
  fetch('/api/pedidos', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      cliente: nombre, direccion,
      items: carrito.map(({ id, nombre, cantidad, precio }) => ({ id, nombre, cantidad, precio })),
      total
    })
  }).catch(() => {});

  carrito = []; sync(); cerrarCarrito();
  const t = document.getElementById('toast');
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 3200);
}

cargarProductos();
</script>
</body>
</html>
