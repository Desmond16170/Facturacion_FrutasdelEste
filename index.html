<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frutas y Jugos del Este</title>
<meta name="description" content="Pulpas congeladas y galones de jugo natural. Hacé tu pedido aquí.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,700;0,900;1,700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --verde:    #1b4332;
  --verde-m:  #2d6a4f;
  --verde-c:  #52b788;
  --verde-s:  #d8f3dc;
  --naranja:  #e76f51;
  --rojo:     #e63946;
  --crema:    #fefae0;
  --crema-d:  #f5f0d8;
  --texto:    #1a1a1a;
  --gris:     #6b7280;
  --blanco:   #ffffff;
  --radio:    16px;
  --sombra:   0 2px 16px rgba(0,0,0,0.07);
  --sombra-h: 0 8px 32px rgba(27,67,50,0.16);
}
body { font-family:'Plus Jakarta Sans',sans-serif; background:var(--crema); color:var(--texto); min-height:100vh; -webkit-font-smoothing:antialiased; }

/* ── HEADER ── */
header {
  background:var(--verde);
  position:relative;
  overflow:hidden;
}
header::before {
  content:'';
  position:absolute;
  inset:0;
  background: radial-gradient(ellipse at 20% 50%, rgba(82,183,136,0.18) 0%, transparent 60%),
              radial-gradient(ellipse at 80% 20%, rgba(231,111,81,0.12) 0%, transparent 50%);
  pointer-events:none;
}
header::after {
  content:'';
  position:absolute;
  bottom:-1px; left:0; right:0;
  height:48px;
  background:var(--crema);
  clip-path:ellipse(55% 100% at 50% 100%);
  z-index:1;
}
.header-inner {
  position:relative;
  z-index:2;
  padding:1.5rem 1.5rem 3.5rem;
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:0.75rem;
}
.logo-circle {
  width:150px; height:150px;
  border-radius:50%;
  background:white;
  padding:4px;
  box-shadow:0 6px 32px rgba(0,0,0,0.3), 0 0 0 4px rgba(255,255,255,0.15);
  overflow:hidden;
  flex-shrink:0;
}
.logo-circle img { width:140%; height:140%; object-fit:cover; border-radius:50%; margin:-20% -20%; object-position:center 40%; }
.header-badge {
  display:inline-flex; align-items:center; gap:6px;
  background:rgba(255,255,255,0.12);
  border:1px solid rgba(255,255,255,0.2);
  border-radius:99px;
  padding:4px 14px;
  font-size:0.72rem; letter-spacing:0.06em; text-transform:uppercase;
  color:rgba(255,255,255,0.85); font-weight:600;
}
header h1 {
  font-family:'Fraunces',serif;
  font-size:clamp(1.8rem,6vw,2.8rem);
  font-weight:900;
  line-height:1.1;
  letter-spacing:-1px;
  color:white;
}
header p { font-size:0.88rem; opacity:0.7; font-weight:300; color:white; }

/* ── FILTROS ── */
.filtros-wrap {
  display:flex; gap:8px; justify-content:center;
  padding:1.25rem 1rem 0.5rem;
  flex-wrap:wrap;
}
.chip {
  border:none; border-radius:99px;
  padding:6px 18px;
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:0.8rem; font-weight:600;
  cursor:pointer;
  transition:all 0.18s;
  background:#e5e7eb; color:var(--gris);
}
.chip.activo { background:var(--verde); color:white; }
.chip:not(.activo):hover { background:var(--verde-s); color:var(--verde); }

main { max-width:960px; margin:0 auto; padding:0.5rem 1rem 8rem; }

.seccion-titulo {
  font-family:'Fraunces',serif;
  font-size:1.3rem; font-weight:700;
  color:var(--verde);
  display:flex; align-items:baseline; gap:0.5rem;
  margin:1.75rem 0 0.9rem;
  padding-bottom:0.5rem;
  border-bottom:2px solid var(--verde-s);
}
.seccion-titulo small {
  font-family:'Plus Jakarta Sans',sans-serif;
  font-size:0.7rem; font-weight:700;
  color:var(--verde-c);
  background:var(--verde-s);
  padding:2px 10px; border-radius:99px;
  margin-left:auto;
}

/* ── SKELETON ── */
.skeleton-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:1rem; margin-top:1rem; }
.skeleton-card { background:white; border-radius:var(--radio); overflow:hidden; }
.sk { background:linear-gradient(90deg,#e5e7eb 25%,#f3f4f6 50%,#e5e7eb 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; }
.sk-img  { height:130px; }
.sk-line { height:12px; border-radius:6px; margin:12px 12px 6px; }
.sk-line.short { width:55%; }
.sk-line.med   { width:75%; margin-bottom:10px; }
.sk-btn  { height:28px; border-radius:99px; width:60%; margin:8px 12px 12px auto; }
@keyframes shimmer { to { background-position:-200% 0; } }

/* ── GRID PRODUCTOS ── */
.productos-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); gap:1rem; }

/* ── CARD ── */
.card {
  background:var(--blanco);
  border-radius:var(--radio);
  box-shadow:var(--sombra);
  overflow:hidden;
  display:flex; flex-direction:column;
  transition:transform 0.22s, box-shadow 0.22s;
  border:1.5px solid transparent;
}
.card:hover { transform:translateY(-3px); box-shadow:var(--sombra-h); border-color:var(--verde-s); }
.card-img {
  width:100%; aspect-ratio:4/3;
  background:var(--crema-d);
  display:flex; align-items:center; justify-content:center;
  font-size:3.2rem; overflow:hidden; flex-shrink:0;
  position:relative;
}
.card-img img { width:100%; height:100%; object-fit:cover; display:block; }
.card-logo-sello { position:absolute; top:8px; right:8px; width:54px; height:54px; border-radius:50%; background:white; border:3px solid rgba(255,255,255,0.95); box-shadow:0 3px 16px rgba(0,0,0,0.28), 0 0 0 1px rgba(27,67,50,0.08); overflow:hidden; display:flex; align-items:center; justify-content:center; z-index:2; flex-shrink:0; }
.card-logo-sello img { width:140%; height:140%; object-fit:cover; border-radius:50%; margin:-20% -20%; object-position:center 40%; }
.card-badge { position:absolute; top:8px; left:8px; z-index:3; display:flex; flex-direction:column; gap:4px; pointer-events:none; }
.badge { display:inline-flex; align-items:center; gap:3px; font-size:0.61rem; font-weight:800; padding:3px 9px; border-radius:99px; line-height:1; letter-spacing:0.04em; text-transform:uppercase; }
.badge.oferta { background:#e63946; color:white; box-shadow:0 2px 8px rgba(230,57,70,0.45); }
.badge.promo  { background:#f4a261; color:white; box-shadow:0 2px 8px rgba(244,162,97,0.45); }
.card.agotado .card-img::after { content:"AGOTADO"; position:absolute; inset:0; background:rgba(0,0,0,0.52); display:flex; align-items:center; justify-content:center; color:white; font-weight:800; font-size:0.9rem; letter-spacing:0.1em; z-index:1; backdrop-filter:blur(1px); }
.card.agotado { opacity:0.82; }
.card.agotado .qty-btn.plus { opacity:0.35; pointer-events:none; cursor:not-allowed; }
.card-body { padding:0.85rem; display:flex; flex-direction:column; flex:1; gap:0.25rem; }
.card-nombre { font-weight:700; font-size:0.88rem; line-height:1.3; color:var(--verde); }
.card-desc   { font-size:0.73rem; color:var(--gris); line-height:1.4; flex:1; }
.card-unidad {
  font-size:0.67rem;
  background:var(--verde-s); color:var(--verde-m);
  padding:2px 8px; border-radius:99px;
  display:inline-block; font-weight:700; width:fit-content;
  margin-top:2px;
}
.card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:0.6rem; gap:0.25rem; flex-wrap:nowrap; }
.card-precio-wrap { display:flex; flex-direction:column; align-items:flex-start; gap:2px; }
.card-precio { font-weight:800; font-size:0.95rem; color:white; white-space:nowrap; background:var(--naranja); padding:5px 12px; border-radius:99px; display:inline-block; }
.card-precio.oferta-precio { background:var(--rojo); }
.card-precio-antes { font-size:0.7rem; color:var(--gris); text-decoration:line-through; padding-left:4px; }

/* ── QTY CONTROLS ── */
.qty-wrap { display:flex; align-items:center; gap:3px; }
.qty-btn {
  width:28px; height:28px; border-radius:50%; border:none;
  font-size:1rem; font-weight:700; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background 0.15s, transform 0.1s;
  line-height:1; flex-shrink:0;
}
.qty-btn:active { transform:scale(0.88); }
.qty-btn.plus  { background:var(--verde); color:white; }
.qty-btn.plus:hover  { background:var(--verde-m); }
.qty-btn.minus { background:#f0f0f0; color:var(--verde); }
.qty-num { font-weight:800; font-size:0.85rem; min-width:18px; text-align:center; color:var(--verde); }

/* ── FAB CARRITO ── */
#carrito-fab {
  position:fixed; bottom:1.25rem; left:50%;
  transform:translateX(-50%) translateY(120px);
  background:var(--naranja); color:white;
  border:none; border-radius:99px;
  padding:0.85rem 1.5rem;
  font-size:0.92rem; font-weight:700;
  cursor:pointer;
  box-shadow:0 6px 24px rgba(231,111,81,0.45);
  display:flex; align-items:center; gap:0.6rem;
  transition:transform 0.35s cubic-bezier(.34,1.56,.64,1);
  z-index:100; font-family:'Plus Jakarta Sans',sans-serif; white-space:nowrap;
}
#carrito-fab.visible { transform:translateX(-50%) translateY(0); }
#carrito-badge {
  background:white; color:var(--naranja);
  border-radius:50%; width:22px; height:22px;
  font-size:0.7rem; display:flex; align-items:center; justify-content:center;
  font-weight:800;
}

/* ── OVERLAY + PANEL ── */
#overlay { position:fixed; inset:0; background:rgba(0,0,0,0.5); opacity:0; pointer-events:none; transition:opacity 0.3s; z-index:200; backdrop-filter:blur(2px); }
#overlay.visible { opacity:1; pointer-events:all; }

#panel-carrito {
  position:fixed; bottom:0; left:0; right:0;
  background:var(--blanco); border-radius:24px 24px 0 0;
  max-height:88vh; display:flex; flex-direction:column;
  transform:translateY(100%);
  transition:transform 0.35s cubic-bezier(.34,1.15,.64,1);
  z-index:300; box-shadow:0 -6px 40px rgba(0,0,0,0.15);
}
#panel-carrito.abierto { transform:translateY(0); }
.panel-drag { width:40px; height:4px; background:#e5e7eb; border-radius:99px; margin:12px auto 0; flex-shrink:0; }
.panel-header { display:flex; align-items:center; justify-content:space-between; padding:1rem 1.25rem 0.75rem; flex-shrink:0; }
.panel-header h2 { font-family:'Fraunces',serif; font-size:1.25rem; }
.btn-cerrar { background:#f3f4f6; border:none; border-radius:50%; width:32px; height:32px; cursor:pointer; font-size:0.85rem; }
.carrito-scroll { overflow-y:auto; flex:1; padding:0 1.25rem; }
.carrito-item { display:flex; align-items:center; gap:0.75rem; padding:0.8rem 0; border-bottom:1px solid #f3f4f6; }
.ci-img { width:52px; height:52px; border-radius:10px; background:var(--crema-d); display:flex; align-items:center; justify-content:center; font-size:1.8rem; overflow:hidden; flex-shrink:0; }
.ci-img img { width:100%; height:100%; object-fit:cover; }
.ci-info { flex:1; min-width:0; }
.ci-nombre { font-weight:700; font-size:0.86rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ci-precio { font-size:0.73rem; color:var(--gris); }
.ci-controls { display:flex; align-items:center; gap:4px; background:#f8f8f8; border-radius:99px; padding:3px 7px; }
.ci-controls button { background:none; border:none; font-size:1.1rem; cursor:pointer; color:var(--verde); font-weight:700; width:22px; height:22px; display:flex; align-items:center; justify-content:center; border-radius:50%; }
.ci-controls button:hover { background:var(--verde-s); }
.ci-controls span { font-weight:800; font-size:0.85rem; min-width:18px; text-align:center; }
.ci-subtotal { font-weight:800; font-size:0.85rem; color:var(--verde); white-space:nowrap; }
.panel-footer { padding:1rem 1.25rem 1.5rem; flex-shrink:0; border-top:1px solid #f3f4f6; display:flex; flex-direction:column; gap:0.75rem; }
.total-row { display:flex; justify-content:space-between; align-items:center; }
.total-label { font-size:0.85rem; color:var(--gris); font-weight:500; }
#carrito-grand-total { font-size:1.3rem; font-weight:800; color:var(--verde); }
.form-cliente { display:flex; flex-direction:column; gap:0.5rem; }
.form-cliente input { border:2px solid #e5e7eb; border-radius:10px; padding:0.65rem 1rem; font-family:'Plus Jakarta Sans',sans-serif; font-size:0.9rem; outline:none; transition:border-color 0.2s; background:#fafafa; }
.form-cliente input:focus { border-color:var(--verde); background:white; }
.form-cliente input.error { border-color:var(--rojo); }
.btn-whatsapp { width:100%; background:#25D366; color:white; border:none; border-radius:14px; padding:1rem; font-size:1rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:0.5rem; font-family:'Plus Jakarta Sans',sans-serif; transition:background 0.2s; }
.btn-whatsapp:hover { background:#1ebe5d; }



.empty-state { text-align:center; padding:4rem 2rem; color:var(--gris); }
.empty-state span { font-size:3rem; display:block; margin-bottom:1rem; }

@media (max-width:480px) {
  .productos-grid { grid-template-columns:repeat(2,1fr); gap:0.65rem; }
  .card-body { padding:0.75rem; }
  .card-nombre { font-size:0.9rem; }
  .card-desc { display:none; }
  .logo-circle { width:120px; height:120px; }
}
@media (min-width:640px) {
  #panel-carrito { max-width:480px; left:50%; right:auto; transform:translateX(-50%) translateY(100%); }
  #panel-carrito.abierto { transform:translateX(-50%) translateY(0); }
}
</style>
</head>

<script>
const WHATSAPP = '50662253122';
const NEGOCIO  = 'Frutas y Jugos del Este';

let productos = [], carrito = [], filtroActual = 'todo';

// ── Skeleton cards ──
function skeletonCard() {
  return `<div class="skeleton-card">
    <div class="sk sk-img"></div>
    <div class="sk sk-line med"></div>
    <div class="sk sk-line short"></div>
    <div class="sk sk-btn"></div>
  </div>`;
}

// ── Cargar productos ──
async function cargarProductos() {
  try {
    const res = await fetch('/api/productos');
    productos = await res.json();
    renderCatalogo();
  } catch {
    document.getElementById('productos-container').innerHTML =
      '<div class="empty-state"><span>⚠️</span><p>Error cargando productos. Recargá la página.</p></div>';
  }
}

function filtrar(cat, el) {
  filtroActual = cat;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('activo'));
  el.classList.add('activo');
  renderCatalogo();
}

function renderCatalogo() {
  const cont = document.getElementById('productos-container');
  let lista = filtroActual === 'todo' ? productos : productos.filter(p => p.categoria === filtroActual);
  const pulpas  = lista.filter(p => p.categoria === 'pulpa');
  const galones = lista.filter(p => p.categoria === 'galon');
  if (!lista.length) {
    cont.innerHTML = '<div class="empty-state"><span>🍃</span><p>No hay productos en esta categoría.</p></div>'; return;
  }
  let html = '';
  if (pulpas.length)  html += seccion('🧊 Pulpas Congeladas', pulpas,  pulpas.length  + ' variedades');
  if (galones.length) html += seccion('🥤 Galones de Jugo',   galones, galones.length + ' variedades');
  cont.innerHTML = html;
  cont.querySelectorAll('[data-add]').forEach(btn =>
    btn.addEventListener('click', () => add(btn.dataset.add))
  );
}

function seccion(titulo, items, badge) {
  return `<div class="seccion-titulo">${titulo}<small>${badge}</small></div>
          <div class="productos-grid">${items.map(cardHTML).join('')}</div>`;
}

function cardHTML(p) {
  const q = (carrito.find(c => c.id === p.id) || {}).cantidad || 0;
  const agotado = p.agotado;
  const sello = ``;
  const badges = [];
  if (p.en_oferta) badges.push('<span class="badge oferta">🏷️ Oferta</span>');
  if (p.es_promocion) badges.push('<span class="badge promo">🎉 Promo</span>');
  const badgeDiv = badges.length ? `<div class="card-badge">${badges.join('')}</div>` : '';
  const precioDisplay = p.en_oferta && p.precio_oferta
    ? `<span class="card-precio-antes">₡${Number(p.precio).toLocaleString('es-CR')}</span><span class="card-precio oferta-precio">₡${Number(p.precio_oferta).toLocaleString('es-CR')}</span>`
    : `<span class="card-precio">₡${Number(p.precio).toLocaleString('es-CR')}</span>`;
  const img = p.imagen_url
    ? `<div class="card-img">${badgeDiv}<img src="${p.imagen_url}" alt="${p.nombre}" loading="lazy">${sello}</div>`
    : `<div class="card-img">${badgeDiv}${p.emoji || '🧃'}${sello}</div>`;
  const qtyControls = q > 0
    ? `<div class="qty-wrap">
         <button class="qty-btn minus" onclick="menos('${p.id}')">−</button>
         <span class="qty-num">${q}</span>
         <button class="qty-btn plus" data-add="${p.id}">+</button>
       </div>`
    : `<div class="qty-wrap"><button class="qty-btn plus" data-add="${p.id}">+</button></div>`;
  return `
    <div class="card${agotado ? ' agotado' : ''}">
      ${img}
      <div class="card-body">
        <div class="card-nombre">${p.nombre}</div>
        <div class="card-desc">${p.descripcion || ''}</div>
        <div class="card-unidad">${p.unidad || ''}</div>
        <div class="card-footer">
          <div class="card-precio-wrap">${precioDisplay}</div>
          ${qtyControls}
        </div>
      </div>
    </div>`;
}

function add(id) {
  const p = productos.find(x => x.id === id); if (!p) return;
  const i = carrito.findIndex(c => c.id === id);
  if (i >= 0) carrito[i].cantidad++; else carrito.push({ ...p, cantidad: 1 });
  sync();
}
function menos(id) {
  const i = carrito.findIndex(c => c.id === id); if (i < 0) return;
  if (--carrito[i].cantidad <= 0) carrito.splice(i, 1);
  sync();
}

function sync() {
  renderCatalogo();
  const total = carrito.reduce((s,c) => s + c.precio * c.cantidad, 0);
  const qty   = carrito.reduce((s,c) => s + c.cantidad, 0);
  document.getElementById('carrito-badge').textContent = qty;
  document.getElementById('fab-total').textContent     = qty ? `· ₡${total.toLocaleString('es-CR')}` : '';
  document.getElementById('carrito-fab').classList.toggle('visible', qty > 0);
  renderPanel();
}

function renderPanel() {
  const total = carrito.reduce((s,c) => s + c.precio * c.cantidad, 0);
  document.getElementById('carrito-lista').innerHTML = carrito.map(item => {
    const img = item.imagen_url
      ? `<div class="ci-img"><img src="${item.imagen_url}" alt="${item.nombre}"></div>`
      : `<div class="ci-img">${item.emoji || '🧃'}</div>`;
    return `
      <div class="carrito-item">
        ${img}
        <div class="ci-info">
          <div class="ci-nombre">${item.nombre}</div>
          <div class="ci-precio">₡${Number(item.precio).toLocaleString('es-CR')} c/u</div>
        </div>
        <div class="ci-controls">
          <button onclick="menos('${item.id}')">−</button>
          <span>${item.cantidad}</span>
          <button onclick="add('${item.id}')">+</button>
        </div>
        <div class="ci-subtotal">₡${(item.precio*item.cantidad).toLocaleString('es-CR')}</div>
      </div>`;
  }).join('');
  document.getElementById('carrito-grand-total').textContent = `₡${total.toLocaleString('es-CR')}`;
}

function abrirCarrito()  { document.getElementById('panel-carrito').classList.add('abierto');    document.getElementById('overlay').classList.add('visible'); }
function cerrarCarrito() { document.getElementById('panel-carrito').classList.remove('abierto'); document.getElementById('overlay').classList.remove('visible'); }

async function enviarPedido() {
  const nombre    = document.getElementById('cliente-nombre').value.trim();
  const direccion = document.getElementById('cliente-direccion').value.trim();
  const input     = document.getElementById('cliente-nombre');
  if (!nombre) { input.classList.add('error'); input.focus(); return; }
  input.classList.remove('error');
  const total  = carrito.reduce((s,c) => s + c.precio * c.cantidad, 0);
  const lineas = carrito.map(i => `  • ${i.nombre} × ${i.cantidad} = ₡${(i.precio*i.cantidad).toLocaleString('es-CR')}`).join('\n');
  const msg    = ` *NUEVO PEDIDO — ${NEGOCIO}*\n\n *Cliente:* ${nombre}\n` +
    (direccion ? ` *Dirección:* ${direccion}\n` : '') +
    `\n*Productos:*\n${lineas}\n\n *TOTAL: ₡${total.toLocaleString('es-CR')}*\n\n_Pedido desde el catálogo online_`;
  window.open(`https://wa.me/${WHATSAPP}?text=${encodeURIComponent(msg)}`, '_blank');
  fetch('/api/pedidos', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      cliente:nombre, direccion,
      items: carrito.map(({ id, nombre, cantidad, precio }) => ({ id, nombre, cantidad, precio })),
      total
    })
  }).catch(() => {});
  carrito = []; sync(); cerrarCarrito();
}

// Mostrar skeletons
document.getElementById('productos-container').innerHTML =
  '<div class="skeleton-grid">' + Array(6).fill(skeletonCard()).join('') + '</div>';

cargarProductos();
</script>
