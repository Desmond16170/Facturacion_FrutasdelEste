<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso administrador — Jugos y Frutas Del Este</title>
  <link rel="icon" type="image/png" href="assets/logo.png" />
    <link rel="stylesheet" href="styles.css" />
  <style>
    .login-wrap {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg, #f5f5f5);
      padding: 1.5rem;
    }
    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 380px;
    }
    .login-card h1 {
      font-size: 1.25rem;
      margin: 0 0 0.25rem;
    }
    .login-card p {
      color: #666;
      font-size: .9rem;
      margin: 0 0 1.75rem;
    }
    .login-card label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      margin-bottom: .35rem;
    }
    .login-card input[type="email"],
    .login-card input[type="password"] {
      width: 100%;
      padding: .65rem .85rem;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: .95rem;
      margin-bottom: 1rem;
      box-sizing: border-box;
      transition: border-color .2s;
    }
    .login-card input:focus {
      outline: none;
      border-color: var(--primary, #e63946);
    }
    .btn-login {
      width: 100%;
      padding: .75rem;
      background: var(--primary, #e63946);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .2s;
    }
    .btn-login:disabled { opacity: .6; cursor: not-allowed; }
    .login-error {
      background: #fde;
      color: #c00;
      border-radius: 8px;
      padding: .65rem .85rem;
      font-size: .88rem;
      margin-bottom: 1rem;
      display: none;
    }
    .login-logo {
      font-weight: 800;
      font-size: 1.1rem;
      color: var(--primary, #e63946);
      margin-bottom: 1.25rem;
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <img class="login-logo-img" src="assets/logo.png" alt="Jugos y Frutas Del Este" />
        <span class="login-logo">Jugos y Frutas Del Este</span>
      <h1>Panel de administración</h1>
      <p>Ingresa con tu correo y contraseña de administrador.</p>

      <div class="login-error" id="loginError"></div>

      <label for="emailInput">Correo electrónico</label>
      <input type="email" id="emailInput" placeholder="admin@ejemplo.com" autocomplete="email" />

      <label for="passwordInput">Contraseña</label>
      <input type="password" id="passwordInput" placeholder="••••••••" autocomplete="current-password" />

      <button class="btn-login" id="loginBtn" type="button">Ingresar</button>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="supabase.js"></script>
  <script>
    (async () => {
      // Si ya hay sesión activa → redirigir al admin
      const { data: { session } } = await window._sb.auth.getSession();
      if (session) { window.location.href = "admin.html"; return; }

      const emailInput    = document.getElementById("emailInput");
      const passwordInput = document.getElementById("passwordInput");
      const loginBtn      = document.getElementById("loginBtn");
      const loginError    = document.getElementById("loginError");

      function showError(msg) {
        loginError.textContent = msg;
        loginError.style.display = "block";
      }

      loginBtn.addEventListener("click", async () => {
        const email    = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) { showError("Completa correo y contraseña."); return; }

        loginBtn.disabled = true;
        loginBtn.textContent = "Ingresando…";
        loginError.style.display = "none";

        const { error } = await window._sb.auth.signInWithPassword({ email, password });

        if (error) {
          showError("Correo o contraseña incorrectos.");
          loginBtn.disabled = false;
          loginBtn.textContent = "Ingresar";
        } else {
          window.location.href = "admin.html";
        }
      });

      // Permitir Enter para enviar
      [emailInput, passwordInput].forEach(input => {
        input.addEventListener("keydown", e => { if (e.key === "Enter") loginBtn.click(); });
      });
    })();
  </script>
</body>
</html>
